name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET SDK info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore WeatherApiWrapper.slnx

      - name: Build
        run: dotnet build WeatherApiWrapper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WeatherApiWrapper.slnx --configuration Release --no-build --verbosity normal
        env:
          WeatherApi__ApiKey: test-key
