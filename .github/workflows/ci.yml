name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WeatherApiWrapper.slnx

      - name: Build
        run: dotnet build WeatherApiWrapper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WeatherApiWrapper.slnx --configuration Release --no-build --verbosity normal